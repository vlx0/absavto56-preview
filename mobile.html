<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Превью — телефон</title>
  <style>
    :root {
      --bezel: #1a1d22;
      --screen: #0f141b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(800px 400px at 50% 0%, rgba(255, 176, 32, 0.12), transparent 60%),
        #0b0d10;
      font-family: system-ui, sans-serif;
      color: #c9ced6;
    }
    .wrap {
      display: grid;
      gap: 0.85rem;
      justify-items: center;
      padding: 1rem;
    }
    .label {
      font-size: 0.9rem;
      opacity: 0.8;
    }
    .phone {
      width: 390px;
      height: 844px;
      max-width: calc(100vw - 2rem);
      max-height: calc(100vh - 5rem);
      border-radius: 28px;
      padding: 10px;
      background: linear-gradient(160deg, #2a2f38, #12151a);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.08),
        0 30px 80px rgba(0,0,0,0.55);
    }
    .screen {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 20px;
      background: var(--screen);
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="label">Режим телефона · iPhone 14 (390×844)</div>
    <div class="phone">
      <iframe class="screen" src="./index.html" title="Абсолют Авто 56"></iframe>
    </div>
  </div>
</body>
</html>
